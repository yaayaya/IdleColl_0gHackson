<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
    <defs>
      <radialGradient id="rbGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#0b0e17" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#00f0ff"/>
        <stop offset="50%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
    </defs>
    <rect width="200" height="200" rx="28" fill="#070a12"/>
    <rect x="3" y="3" width="194" height="194" rx="25" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="100" cy="95" r="75" fill="url(#rbGlow)"/>
    <!-- Cyber Ears -->
    <path d="M80 85 L70 25 Q78 20 88 32 L88 80 Z" fill="url(#earGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <path d="M120 85 L130 25 Q122 20 112 32 L112 80 Z" fill="url(#earGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Head Base -->
    <ellipse cx="100" cy="96" rx="42" ry="38" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <!-- Cyber Visor / Eyes -->
    <path d="M72 88 Q100 82 128 88 L126 98 Q100 102 74 98 Z" fill="#00f0ff" filter="drop-shadow(0 0 8px #00f0ff)"/>
    <line x1="72" y1="93" x2="128" y2="93" stroke="#fff" stroke-width="1"/>
    <!-- Nose & Whiskers -->
    <polygon points="100,106 96,112 104,112" fill="#ec4899"/>
    <line x1="62" y1="108" x2="45" y2="104" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="62" y1="114" x2="48" y2="118" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="138" y1="108" x2="155" y2="104" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="138" y1="114" x2="152" y2="118" stroke="#a855f7" stroke-width="1.5"/>
    <!-- Antenna -->
    <circle cx="100" cy="62" r="3" fill="#ec4899"/>
    <line x1="100" y1="65" x2="100" y2="72" stroke="#ec4899" stroke-width="1.5"/>
    <!-- Label Banner -->
    <rect x="25" y="156" width="150" height="24" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="100" y="172" font-size="11" font-family="monospace" font-weight="900" fill="#c084fc" text-anchor="middle" letter-spacing="1">#02 月球突變兔</text>
  </svg>