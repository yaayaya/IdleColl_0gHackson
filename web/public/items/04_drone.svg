<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
    <defs>
      <radialGradient id="drGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#0b0e17" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="200" height="200" rx="28" fill="#070a12"/>
    <rect x="3" y="3" width="194" height="194" rx="25" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="100" cy="95" r="75" fill="url(#drGlow)"/>
    <!-- Propellers / Rotor Arms -->
    <line x1="45" y1="65" x2="155" y2="65" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="50" cy="65" rx="24" ry="4" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <ellipse cx="150" cy="65" rx="24" ry="4" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Main Chassis -->
    <rect x="70" y="60" width="60" height="42" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <!-- Hazard Stripes -->
    <path d="M78 72 L86 64 M88 72 L96 64 M98 72 L106 64" stroke="#eab308" stroke-width="2.5"/>
    <!-- Red Camera Eye -->
    <circle cx="100" cy="85" r="10" fill="#991b1b" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="100" cy="85" r="4" fill="#fee2e2" filter="drop-shadow(0 0 6px #ef4444)"/>
    <!-- Mining Drill Bit -->
    <polygon points="90,102 110,102 104,136 96,136" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="93" y1="112" x2="107" y2="112" stroke="#475569" stroke-width="1.5"/>
    <line x1="95" y1="124" x2="105" y2="124" stroke="#475569" stroke-width="1.5"/>
    <!-- Sparkles -->
    <path d="M85 138 L80 144 M115 138 L120 144" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Label Banner -->
    <rect x="25" y="156" width="150" height="24" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="100" y="172" font-size="11" font-family="monospace" font-weight="900" fill="#fcd34d" text-anchor="middle" letter-spacing="1">#04 採礦無人機</text>
  </svg>