    <path d="M140 100 Q152 115 142 130" stroke="#00f0ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Label Banner -->
    <rect x="25" y="156" width="150" height="24" rx="6" fill="#0c4a6e" stroke="#00f0ff" stroke-width="1.2"/>
